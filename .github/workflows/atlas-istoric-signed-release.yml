name: Atlas Istoric - APK semnat permanent

# Production signing is NEVER triggered by a normal push or a pull request.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Scrie SEMNEZ pentru a construi cu cheia release din GitHub Secrets"
        required: true
        type: string
  push:
    branches: [atlas-istoric-professional-release]
    paths:
      - 'atlas-istoric/docs/RELEASE_REQUEST.md'
      - '.github/workflows/atlas-istoric-signed-release.yml'

permissions:
  contents: read

jobs:
  signed-apk:
    # Workflow dispatch is available when the workflow exists on the default branch.
    # Branch-only fallback: owner explicitly enables a repository Variable AND uses
    # [sign-release] in a commit that changes the release request marker.
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' &&
         github.ref_name == 'atlas-istoric-professional-release' &&
         inputs.confirm == 'SEMNEZ') ||
        (github.event_name == 'push' &&
         github.ref_name == 'atlas-istoric-professional-release' &&
         vars.ATLAS_ENABLE_RELEASE_SIGNING == 'true' &&
         contains(github.event.head_commit.message, '[sign-release]'))
      }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas-istoric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android build tools
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate required release secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ATLAS_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ATLAS_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ATLAS_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ATLAS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]] ||
            { echo "Nu sunt configurate toate cele patru GitHub Secrets pentru cheia permanentă." >&2; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/atlas-release-signing.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ATLAS_RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Verify database migrations
        run: |
          set -euo pipefail
          python3 checks/sqlite_learning_migration_check.py
          python3 checks/sqlite_document_migration_check.py
      - name: Compile unit tests and signed release
        env:
          ATLAS_RELEASE_STORE_PASSWORD: ${{ secrets.ATLAS_RELEASE_STORE_PASSWORD }}
          ATLAS_RELEASE_KEY_ALIAS: ${{ secrets.ATLAS_RELEASE_KEY_ALIAS }}
          ATLAS_RELEASE_KEY_PASSWORD: ${{ secrets.ATLAS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Verify signature and APK integrity
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee app/build/outputs/apk/release/certificate-info.txt
          (
            cd app/build/outputs/apk/release
            sha256sum app-release.apk > SHA256SUMS.txt
          )
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: atlas-istoric-signed-release-apk
          path: |
            atlas-istoric/app/build/outputs/apk/release/app-release.apk
            atlas-istoric/app/build/outputs/apk/release/SHA256SUMS.txt
            atlas-istoric/app/build/outputs/apk/release/certificate-info.txt
          retention-days: 90
          if-no-files-found: error
      - name: Clean temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/atlas-release-signing.jks"
