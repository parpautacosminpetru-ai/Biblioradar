name: Atlas Istoric - Android APK
on:
  push:
    branches: [atlas-istoric-android]
    paths:
      - 'atlas-istoric/**'
      - '.github/workflows/atlas-istoric-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: atlas-istoric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 SDK
        run: |
          sdkmanager --licenses < /dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and test
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Check APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-istoric-android-apk
          path: |
            atlas-istoric/app/build/outputs/apk/debug/app-debug.apk
            atlas-istoric/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
