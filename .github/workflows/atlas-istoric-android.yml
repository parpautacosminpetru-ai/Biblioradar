name: Atlas Istoric - Android APK
on:
  push:
    branches: [atlas-istoric-android, atlas-istoric-laboratorul-sursei-v1-4, atlas-istoric-professional-release]
    paths:
      - 'atlas-istoric/**'
      - '.github/workflows/atlas-istoric-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: atlas-istoric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 SDK
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify learning database migration
        run: python3 checks/sqlite_learning_migration_check.py
      - name: Verify documentary migration
        run: python3 checks/sqlite_document_migration_check.py
      - name: Build and test
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Check APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-istoric-android-apk
          path: |
            atlas-istoric/app/build/outputs/apk/debug/app-debug.apk
            atlas-istoric/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
