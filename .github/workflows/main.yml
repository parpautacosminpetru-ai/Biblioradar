name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Set up Android
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract BiblioRadar project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          ZIP="./Lupa_de_Relevanta_Android_v0.2_GitHub.zip"

          if [ ! -f "$ZIP" ]; then
            ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          fi

          echo "Arhivă folosită: $ZIP"
          unzip -q "$ZIP" -d project

          test -f project/app/build.gradle.kts
          test -f project/app/src/main/java/ro/lupaocr/app/MainActivity.kt

      - name: Use stable Android configuration
        shell: bash
        run: |
          set -e

          FILE="project/app/build.gradle.kts"

          sed -i -E \
            's/compileSdk = [0-9]+/compileSdk = 36/' \
            "$FILE"

          sed -i -E \
            's/targetSdk = [0-9]+/targetSdk = 36/' \
            "$FILE"

          sed -i -E \
            's#androidx\.core:core-ktx:[0-9.]+#androidx.core:core-ktx:1.17.0#' \
            "$FILE"

          sed -i -E \
            's#androidx\.activity:activity-ktx:[0-9.]+#androidx.activity:activity-ktx:1.10.1#' \
            "$FILE"

      - name: Fix MainActivity Kotlin
        shell: bash
        run: |
          set -e

          FILE="project/app/src/main/java/ro/lupaocr/app/MainActivity.kt"

          sed -i \
            's/ScrollView.LayoutParams(/FrameLayout.LayoutParams(/g' \
            "$FILE"

          sed -i \
            's/permissions: Array<out String>/permissions: Array<String>/g' \
            "$FILE"

          echo "Verificare corecții:"
          grep -n "settingsPanel.addView" "$FILE"
          grep -n "onRequestPermissionsResult" "$FILE"

      - name: Build BiblioRadar APK
        shell: bash
        run: |
          gradle --no-daemon -p project :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p output

          cp \
            project/app/build/outputs/apk/debug/app-debug.apk \
            output/BiblioRadar.apk

      - name: Upload BiblioRadar APK
        uses: actions/upload-artifact@v4
        with:
          name: BiblioRadar-APK
          path: output/BiblioRadar.apk
          if-no-files-found: error
