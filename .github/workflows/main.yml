name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Set up Android
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract BiblioRadar project
        run: |
          mkdir -p project
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          echo "Using ZIP: $ZIP"
          unzip -q "$ZIP" -d project
          test -f project/app/build.gradle.kts

      - name: Use stable Android configuration
        run: |
          FILE="project/app/build.gradle.kts"

          sed -i -E 's/compileSdk = [0-9]+/compileSdk = 36/' "$FILE"

          sed -i -E \
            's#androidx\.core:core-ktx:[0-9.]+#androidx.core:core-ktx:1.17.0#' \
            "$FILE"

          sed -i -E \
            's#androidx\.activity:activity-ktx:[0-9.]+#androidx.activity:activity-ktx:1.10.1#' \
            "$FILE"

      - name: Build BiblioRadar
        run: |
          gradle --no-daemon -p project :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp project/app/build/outputs/apk/debug/app-debug.apk output/BiblioRadar.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BiblioRadar-APK
          path: output/BiblioRadar.apk
          if-no-files-found: error
